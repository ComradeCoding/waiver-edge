# "Commish" scoreboard theme: navy ink surfaces, one signal-orange accent.
# Streamlit reads these natively (buttons, sliders, tabs, links all pick up
# primaryColor automatically) - app.py layers the rest (fonts, textures,
# flat surfaces, semantic green/red/yellow) on top with injected CSS,
# since Streamlit's theme config alone can't express those.
[theme]
base = "dark"
primaryColor = "#FF6B2C"            # signal-500
backgroundColor = "#0B162A"         # ink-900
secondaryBackgroundColor = "#13243D"  # ink-800
textColor = "#E0E7F0"               # ink-100
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
